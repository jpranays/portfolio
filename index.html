<!doctype html>
<html lang="en" class="dark" data-accent="signal">

		<meta charset="UTF-8" />

		<meta name="robots" content="index, follow" />

		<!-- Pre-paint theme + accent (reads pj-theme / pj-accent; dark is the
		     default, system preference respected when nothing is stored). Runs
		     before any stylesheet so first paint never flashes. -->
		<script>
			(function () {
				try {
					var root = document.documentElement;
					var stored = localStorage.getItem("pj-theme");
					var dark;
					if (stored === "light") dark = false;
					else if (stored === "dark") dark = true;
					else
						dark = !(
							window.matchMedia &&
							window.matchMedia("(prefers-color-scheme: light)").matches
						);
					root.classList.toggle("dark", dark);

					var accent = localStorage.getItem("pj-accent");
					var valid = ["signal", "ion", "photon", "ember", "pulse", "mono"];
					root.setAttribute(
						"data-accent",
						valid.indexOf(accent) > -1 ? accent : "signal"
					);
				} catch (e) {
					/* defaults in markup already apply */
				}
			})();
		</script>
